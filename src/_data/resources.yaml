# Resources & links section — add/remove entries freely, the page rebuilds the list.

meetingRolesIntro: >
  A Toastmasters meeting is comprised of many different speaking roles. No two
  roles are the same and each is designed to help you improve in a specific
  area of communication. Below is a brief summary of what's involved:

# NOTE: the live site's Meeting Roles page is actually broken (intro text
# loads, then the role list itself is missing). These are the standard
# Toastmasters meeting roles — swap in the club's own descriptions if you have them.
meetingRoles:
  - role: Toastmaster of the Day
    description: Hosts and runs the meeting from start to finish, introducing each segment and speaker.
  - role: Prepared Speaker
    description: Delivers a prepared speech from the Pathways education program.
  - role: Table Topics Master
    description: Runs the impromptu speaking segment, posing questions for members to answer on the spot.
  - role: Evaluator
    description: Gives constructive feedback on a prepared speaker's speech.
  - role: General Evaluator
    description: Evaluates the meeting as a whole, including all other roles.
  - role: Timer
    description: Tracks and signals speaking times for every segment of the meeting.
  - role: Grammarian
    description: Tracks language use during the meeting and highlights good (and awkward) word choices.
  - role: Ah-Counter
    description: Counts filler words and sounds ("um", "ah", "like") used during the meeting.

